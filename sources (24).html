<title>Carnet de fouille</title>
<style>

  #cf{
    --bg:#F4F4F7; --surface:#FFFFFF; --raise:#FAFAFC; --sunk:#EDEDF2;
    --ink:#0B0B0F; --text:#1D1D22; --muted:#63636E; --faint:#9A9AA6;
    --line:#E6E6EC; --line-2:#D5D5DE;
    --blue:#0071E3; --blue-deep:#0059B8; --blue-tint:#E8F1FE;
    --green:#0E8A55; --green-tint:#E4F5EC;
    --violet:#6D45C8; --violet-tint:#F0EAFB;
    --amber:#B0680B; --amber-tint:#FBF0DC;
    --red:#D93A3F; --red-tint:#FCEBEC;
    --sh-1:0 1px 2px rgba(16,16,32,.05);
    --sh-2:0 1px 3px rgba(16,16,32,.06),0 10px 24px -16px rgba(16,16,32,.28);
    --sh-3:0 2px 6px rgba(16,16,32,.07),0 24px 48px -20px rgba(16,16,32,.32);
    --sh-lg:0 20px 60px -18px rgba(16,16,32,.34);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',system-ui,sans-serif;
    font-variant-numeric:tabular-nums; color:var(--text);
    background:var(--bg);
    background-image:radial-gradient(70% 45% at 82% -8%,rgba(0,113,227,.07),transparent 62%),radial-gradient(50% 40% at 4% 4%,rgba(109,69,200,.045),transparent 60%);
    min-height:100vh; -webkit-font-smoothing:antialiased; letter-spacing:-0.014em;
  }
  #cf *,#cf *::before,#cf *::after{box-sizing:border-box;}
  :where(#cf) :where(button){font:inherit;color:inherit;background:none;border:none;cursor:pointer;letter-spacing:inherit;}
  :where(#cf) :where(input,textarea,select){font:inherit;letter-spacing:inherit;}
  :where(#cf) :where(h1,h2,h3,p,ul,ol,li){margin:0;padding:0;list-style:none;}
  #cf button:focus-visible,#cf a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px;}
  :where(#cf) :where(input,textarea,select):focus,:where(#cf) :where(input,textarea,select):focus-visible{outline:none;}
  #cf ::-webkit-scrollbar{width:9px;height:9px;}
  #cf ::-webkit-scrollbar-thumb{background:#CBCBD6;border-radius:9px;border:2px solid transparent;background-clip:padding-box;}
  #cf ::-webkit-scrollbar-thumb:hover{background:#B0B0BE;background-clip:padding-box;}
  #cf ::-webkit-scrollbar-track{background:transparent;}
  #cf ::selection{background:var(--blue-tint);color:var(--blue-deep);}

  /* ═══ shell ═══ */
  .shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh;}
  .rail{padding:22px 12px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;
        background:#FAFAFC;border-right:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 10px 24px;}
  .brand .logo{width:31px;height:31px;border-radius:9px;background:linear-gradient(150deg,#3A9BFF,var(--blue) 55%,var(--blue-deep));display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -6px rgba(0,113,227,.65);}
  .brand .logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.7;}
  .brand b{font-size:15px;font-weight:650;letter-spacing:-0.025em;color:var(--ink);}
  .railsec{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding:22px 12px 9px;}
  .navwrap{position:relative;display:flex;align-items:center;}
  .navwrap .navb{flex:1;}
  .navdel{position:absolute;right:6px;width:20px;height:20px;border-radius:6px;color:var(--faint);font-size:14px;line-height:1;
          opacity:0;transition:opacity .14s,background .14s,color .14s;flex:none;display:grid;place-items:center;}
  .navwrap:hover .navdel{opacity:1;}
  .navdel:hover{background:var(--red-tint);color:var(--red);}
  .navb{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border-radius:10px;padding:9px 11px;color:var(--text);font-size:14px;font-weight:450;
        transition:background .15s,color .15s,transform .1s;position:relative;}
  .navb:hover{background:rgba(0,0,0,.045);}
  .navb:active{transform:scale(.982);}
  .navb.on{background:var(--surface);font-weight:600;color:var(--ink);box-shadow:var(--sh-2);}
  .navb.on::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:17px;border-radius:0 3px 3px 0;background:var(--blue);}
  .navb .dot{width:9px;height:9px;border-radius:99px;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.035);}
  .navb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .navb .ct{font-size:12px;color:var(--faint);font-weight:550;font-variant-numeric:tabular-nums;}
  .navb.on .ct{color:var(--blue);}
  .navb .ic{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.9;flex:none;transition:stroke .15s;}
  .navb.on .ic{stroke:var(--blue);}
  .railadd{margin-top:5px;display:flex;align-items:center;gap:9px;border-radius:10px;padding:9px 11px;color:var(--blue);font-size:14px;font-weight:550;transition:background .15s,transform .1s;}
  .railadd:hover{background:var(--blue-tint);}
  .railadd:active{transform:scale(.982);}

  /* ═══ main ═══ */
  .main{padding:44px clamp(20px,4vw,56px) 72px;min-width:0;max-width:1240px;}
  .mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:26px;flex-wrap:wrap;margin-bottom:30px;}
  .mtitle h1{font-size:34px;font-weight:700;letter-spacing:-0.042em;line-height:1.02;color:var(--ink);}
  .mtitle .sub{font-size:14.5px;color:var(--muted);font-weight:450;margin-top:8px;}
  .mkpis{display:flex;gap:28px;}
  .kpi b{display:block;font-size:28px;font-weight:700;letter-spacing:-0.035em;line-height:1;color:var(--ink);}
  .kpi span{font-size:12px;color:var(--faint);font-weight:500;margin-top:6px;display:block;}

  .toolbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:24px;}
  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:0 13px;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s;}
  .search:focus-within{border-color:var(--line-2);}
  .search svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2;transition:stroke .15s;}
  .search:focus-within svg{stroke:var(--muted);}
  .search input{border:none;background:none;outline:none;padding:10px 0;font-size:14px;color:var(--text);width:180px;}
  .search input::placeholder{color:var(--faint);}
  .grow{flex:1;min-width:2px;}

  /* segmented control — état actif sans ambiguïté */
  .tswitch{display:flex;gap:2px;background:var(--sunk);border-radius:12px;padding:3px;box-shadow:inset 0 1px 2px rgba(16,16,32,.05);}
  .tswitch button{border-radius:9px;padding:8px 15px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;
                  transition:background .18s cubic-bezier(.3,.8,.3,1),color .18s,transform .1s,box-shadow .18s;}
  .tswitch button:hover:not(.on){color:var(--ink);background:rgba(255,255,255,.6);}
  .tswitch button:active{transform:scale(.955);}
  .tswitch button.on{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 2px 6px -1px rgba(0,113,227,.5),0 1px 2px rgba(0,0,0,.1);}

  select.sort{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--muted);font-size:13.5px;font-weight:500;box-shadow:var(--sh-1);cursor:pointer;transition:border-color .15s;}
  select.sort:hover{border-color:var(--line-2);color:var(--text);}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border-radius:11px;padding:10px 18px;font-size:14px;font-weight:550;
       transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 4px 14px -6px rgba(0,113,227,.75);}
  .btn:hover{background:#0A7BEE;box-shadow:0 7px 20px -7px rgba(0,113,227,.85);}
  .btn:active{transform:scale(.962);}

  /* ═══ cartes concurrent ═══ */
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px;}
  .comp{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:19px 19px 17px;box-shadow:var(--sh-1);
        display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;
        transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;}
  @keyframes rise{from{opacity:0;transform:translateY(9px);}}
  .comp::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--blue),#5AB4FF);transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.2,.8,.2,1);}
  .comp:hover{transform:translateY(-3px);box-shadow:var(--sh-3);border-color:#CEE3FA;}
  .comp:hover::after{transform:scaleX(1);}
  .comp:active{transform:translateY(-1px) scale(.988);}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .ch .hd{font-size:16.5px;font-weight:650;letter-spacing:-0.028em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ch .lg{font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:6px;padding:3px 7px;flex:none;letter-spacing:.02em;}
  .cn{font-size:13px;color:var(--faint);font-weight:500;margin-top:1px;}
  .cr{font-size:12.5px;font-weight:500;color:var(--faint);margin-top:11px;}
  .cr.none{color:var(--faint);font-weight:450;font-style:italic;}
  .cfront{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
  .cfl{display:flex;align-items:center;gap:9px;}
  .cfl .dt{color:var(--text);font-weight:550;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* badges de type */
  .tg{font-size:10.5px;font-weight:650;border-radius:6px;padding:3px 7px;flex:none;letter-spacing:.01em;}
  .tg.reel{background:var(--violet-tint);color:var(--violet);}
  .tg.carousel{background:var(--amber-tint);color:var(--amber);}
  .tg.post,.tg.image{background:var(--blue-tint);color:var(--blue-deep);}

  .emptybox{grid-column:1/-1;text-align:center;padding:66px 20px;color:var(--muted);}
  .emptybox b{display:block;font-size:17px;color:var(--ink);font-weight:650;margin-bottom:9px;letter-spacing:-0.025em;}
  .emptybox p{font-size:14px;color:var(--faint);margin-bottom:24px;}

  /* ═══ accueil ═══ */
  .welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .welcome .in{text-align:center;max-width:390px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;}
  .welcome .ic{width:68px;height:68px;border-radius:20px;background:linear-gradient(150deg,#3A9BFF,var(--blue) 55%,var(--blue-deep));display:grid;place-items:center;margin:0 auto 26px;box-shadow:0 16px 36px -12px rgba(0,113,227,.75);}
  .welcome .ic svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2.4;}
  .welcome h1{font-size:29px;font-weight:700;letter-spacing:-0.035em;margin-bottom:11px;color:var(--ink);}
  .welcome p{font-size:15px;color:var(--muted);line-height:1.55;margin-bottom:28px;}

  /* ═══ réserve & production ═══ */
  .seclab{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:650;color:var(--faint);letter-spacing:.07em;text-transform:uppercase;margin:0 0 13px;}
  .seclab i{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:20px;padding:2px 9px;letter-spacing:0;text-transform:none;}
  .rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:30px;}
  .rcard{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px 17px 14px;box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:11px;position:relative;}
  .rhide{position:absolute;top:11px;right:11px;width:20px;height:20px;border-radius:6px;color:var(--faint);font-size:14px;line-height:1;
         opacity:0;transition:opacity .14s,background .14s,color .14s;display:grid;place-items:center;}
  .rcard:hover .rhide{opacity:1;}
  .rhide:hover{background:var(--red-tint);color:var(--red);}
  .hiddenrings{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 30px;}
  .unhide{font-size:12px;font-weight:550;color:var(--faint);background:var(--sunk);border-radius:9px;padding:6px 11px;transition:background .14s,color .14s;}
  .unhide:hover{background:var(--line);color:var(--ink);}
  .rtop{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .rfrac{font-size:12.5px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums;}
  .rring{position:relative;align-self:center;width:76px;height:76px;}
  .rring svg{transform:rotate(-90deg);}
  .rring circle{fill:none;stroke-width:7;stroke-linecap:round;}
  .rring .rt{stroke:var(--sunk);}
  .rring .rp{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);}
  .rring .rp.reel{stroke:var(--violet);} .rring .rp.carousel{stroke:var(--amber);} .rring .rp.image{stroke:var(--blue);}
  .rring .rp.ok{stroke:var(--green);}
  .rring b{position:absolute;inset:0;display:grid;place-items:center;font-size:21px;font-weight:700;letter-spacing:-0.03em;color:var(--ink);}
  .rring b.ok{color:var(--green);}
  .rbot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .rpill{font-size:11px;font-weight:650;border-radius:20px;padding:4px 9px;}
  .rpill.ok{background:var(--green-tint);color:var(--green);}
  .rpill.warn{background:var(--amber-tint);color:var(--amber);}
  .rpill.bad{background:var(--red-tint);color:var(--red);}
  .rtar{font-size:11px;font-weight:550;color:var(--faint);display:inline-flex;align-items:center;gap:6px;}
  .rtar input{width:52px;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;font-weight:650;color:var(--ink);text-align:center;}
  .rtar input:focus{border-color:var(--line-2);background:var(--surface);}

  .badge{font-size:11px;font-weight:700;color:#fff;background:var(--blue);border-radius:20px;padding:2px 8px;font-variant-numeric:tabular-nums;}
  .navb.on .badge{background:var(--blue);}

  .qlist li{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:7px;box-shadow:var(--sh-1);
            content-visibility:auto;contain-intrinsic-size:auto 56px;transition:border-color .16s,box-shadow .16s;}
  .qlist li:hover{border-color:#CEE3FA;box-shadow:var(--sh-2);}
  .qlist li.prog{border-color:rgba(176,104,11,.35);background:#FFFCF6;}
  .qdot{width:9px;height:9px;border-radius:99px;flex:none;}
  .qmain{flex:1;min-width:0;}
  .qsub{font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .qdate{font-size:12px;font-weight:550;color:var(--faint);flex:none;font-variant-numeric:tabular-nums;}
  .qbtn{flex:none;font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:9px;padding:7px 12px;transition:background .14s,color .14s,transform .1s;}
  .qbtn:hover{background:var(--line);color:var(--ink);}
  .qbtn:active{transform:scale(.95);}
  .qbtn.on{background:var(--amber-tint);color:var(--amber);}
  .qdone{flex:none;font-size:12px;font-weight:650;color:#fff;background:var(--green);border-radius:9px;padding:7px 14px;transition:background .14s,transform .1s;box-shadow:0 3px 10px -4px rgba(14,138,85,.8);}
  .qdone:hover{background:#0C7A4A;}
  .qdone:active{transform:scale(.95);}
  .qdone.on{background:var(--green-tint);color:var(--green);box-shadow:none;font-weight:600;}
  .plist li.done{opacity:.5;background:var(--green-tint);border-color:rgba(14,138,85,.2);}
  .plist li.prog{border-color:rgba(176,104,11,.32);background:#FFFCF6;}

  .membar{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px 17px 13px;margin-bottom:22px;box-shadow:var(--sh-1);max-width:660px;}
  .mtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px;}
  .mtop span{font-size:12px;font-weight:600;color:var(--muted);}
  .mtop b{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .mtrack{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;}
  .mtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#5AB4FF);transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .mnote{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.45;}
  .membar.warn .mtrack i{background:linear-gradient(90deg,var(--amber),#E8A33D);}
  .membar.warn .mtop b{color:var(--amber);}
  .membar.crit .mtrack i{background:linear-gradient(90deg,var(--red),#F07178);}
  .membar.crit .mtop b{color:var(--red);}

  .pickbox{background:linear-gradient(160deg,#EEF6FF,var(--surface));border:1px solid #CEE3FA;border-radius:16px;padding:15px 17px;margin-bottom:20px;box-shadow:var(--sh-1);}
  .pblab{font-size:12.5px;font-weight:650;color:var(--blue-deep);margin-bottom:11px;}
  .pbrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .pbrow select,.pbrow input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--text);font-weight:500;}
  .pbrow input{width:88px;text-align:center;font-weight:650;}
  .pbrow select:hover,.pbrow input:hover{border-color:var(--line-2);}
  .ghostbtn{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:none;font-weight:550;}
  .ghostbtn:hover{background:var(--sunk);}
  .qdone.locked,.qdone:disabled{background:var(--sunk);color:var(--faint);box-shadow:none;cursor:not-allowed;}
  .qdone.locked:hover,.qdone:disabled:hover{background:var(--sunk);}
  .qlist li.picked{border-color:var(--blue);background:var(--blue-tint);}
  .qlist .pick{margin-right:1px;}

  .listbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .pick{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line-2);flex:none;cursor:pointer;background:var(--surface);transition:background .14s,border-color .14s;position:relative;}
  .pick:hover{border-color:var(--blue);}
  .pick.on{background:var(--blue);border-color:var(--blue);}
  .pick.on::after{content:'';position:absolute;left:6px;top:2.5px;width:5px;height:9px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg);}
  .plist li.picked{border-color:var(--blue);background:var(--blue-tint);}
  .movebar{position:sticky;top:6px;z-index:5;display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:13px;padding:11px 13px;margin-bottom:12px;box-shadow:var(--sh-3);}
  .movebar .mcount{font-size:13px;font-weight:600;flex:none;}
  .movebar select{flex:1;min-width:150px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:8px 10px;color:#fff;font-size:13px;font-weight:500;cursor:pointer;}
  .movebar select option{color:var(--ink);}
  .movebar .mgo{background:var(--blue);color:#fff;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:650;transition:background .14s,opacity .14s;}

  function dparts(ts){
    var d=new Date(ts);
    if(false)return{D:d.getDate(),M:d.getMonth(),Y:d.getFullYear(),h:d.getHours(),m:d.getMinutes(),W:DOWS[d.getDay()]};
    try{
      var f=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,weekday:'short'});
      var o={};f.formatToParts(d).forEach(function(p){o[p.type]=p.value;});
      var wm={Sun:'dim',Mon:'lun',Tue:'mar',Wed:'mer',Thu:'jeu',Fri:'ven',Sat:'sam'};
      return{D:+o.day,M:+o.month-1,Y:+o.year,h:(+o.hour)%24,m:+o.minute,W:wm[o.weekday]||''};
    }catch(e){return{D:d.getDate(),M:d.getMonth(),Y:d.getFullYear(),h:d.getHours(),m:d.getMinutes(),W:DOWS[d.getDay()]};}
  }

    from.posts=from.posts.filter(function(p){if(set[p.id]){moved.push(p);return false;}return true;});
    var have={};dest.posts.forEach(function(p){if(p.code)have[p.code]=1;});
    var n=0,dup=0;
    moved.forEach(function(p){if(p.code&&have[p.code]){dup++;return;}dest.posts.push(p);if(p.code)have[p.code]=1;n++;});
    ui.picked={};save();render();
    toast(n+' lien'+(n>1?'s':'')+' déplacé'+(n>1?'s':'')+' vers @'+dest.handle+(dup?' · '+dup+' doublon ignoré':''));
  }

  var MAX_POSTS=10000, KEEP_POSTS=5000;
  function totalPosts(){var n=0;S.comps.forEach(function(c){n+=c.posts.length;});return n;}
  function autoCleanup(){
    var all=[];
    S.comps.forEach(function(c){c.posts.forEach(function(p){all.push(p);});});
    if(all.length<=MAX_POSTS)return 0;
    all.sort(function(x,y){return (x.takenAt||0)-(y.takenAt||0);});
    var kill={},n=all.length-KEEP_POSTS;
    for(var i=0;i<n;i++)kill[all[i].id]=1;
    S.comps.forEach(function(c){c.posts=c.posts.filter(function(p){return !kill[p.id];});});
    return n;
  }

      +'<div class="mtrack"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
      +'<div class="mnote">Au-delà de '+MAX_POSTS.toLocaleString('fr-FR')+' liens, les plus anciens sont supprimés pour n\u2019en garder que '+KEEP_POSTS.toLocaleString('fr-FR')+'.</div></div>';

  function pickRandom(accId,type,count){
    var pool=[];
    S.comps.forEach(function(c){
      if(c.owner!==accId)return;
      c.posts.forEach(function(p){if(!isDone(p)&&!p.queued&&ptype(p)===type)pool.push(p);});
    });
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;}
    var n=Math.min(count,pool.length);
    for(var k=0;k<n;k++)pool[k].queued=true;
    return {n:n,avail:pool.length};
  }

  function gridInner(a){
    var cs=compsOf(a.id), q=ui.q.trim().toLowerCase();
    var list=cs.filter(function(c){
      if(q&&(c.handle+' '+(c.name||'')).toLowerCase().indexOf(q)<0)return false;
      if(ui.gtype!=='all'&&countType(c,ui.gtype)===0)return false;
      return true;
    });
    list.sort(function(x,y){
      if(ui.sort==='old')return lastAdded(x)-lastAdded(y);
      if(ui.sort==='az')return x.handle.toLowerCase()<y.handle.toLowerCase()?-1:1;
      var nx=ui.gtype==='all'?x.posts.length:countType(x,ui.gtype);
      var ny=ui.gtype==='all'?y.posts.length:countType(y,ui.gtype);
      if(ui.sort==='most')return ny-nx;
      if(ui.sort==='least')return nx-ny;
      return lastAdded(y)-lastAdded(x);
    });
    if(!cs.length)return '<div class="emptybox"><b>Aucun concurrent</b><p>Ajoute un compte que tu ratisses pour cette page.</p><button class="btn" id="addcomp2">+ Concurrent</button></div>';

  }

  /* ---------- import Content Tracker ---------- */
  function importTracker(raw){
    var d;try{d=JSON.parse(raw);}catch(e){return 0;}
    if(!d||!d.accounts||!d.accounts.length)return 0;
    var added=0;
    d.accounts.forEach(function(ta){
      var name=String(ta.name||'compte').replace(/^@+/,'');
      var mine=null;
      S.my.forEach(function(a){if(a.name.replace(/^@+/,'').toLowerCase()===name.toLowerCase())mine=a;});
      if(!mine){mine={id:uid(),name:'@'+name,color:PAL[S.my.length%PAL.length],cadence:{reel:0,carousel:0,image:0}};S.my.push(mine);}
      if(ta.cadence)mine.cadence={reel:ta.cadence.reel||0,carousel:ta.cadence.carousel||0,image:ta.cadence.image||0};
      var bucket=null;
      S.comps.forEach(function(c){if(c.owner===mine.id&&c.handle==='anciens-liens')bucket=c;});
      if(!bucket){bucket={id:uid(),owner:mine.id,handle:'anciens-liens',name:'Import Content Tracker',lang:'other',note:'',createdAt:now(),posts:[]};S.comps.push(bucket);}
      var have={};bucket.posts.forEach(function(p){if(p.code)have[p.code]=1;});
      (ta.posts||[]).forEach(function(tp){
        var ig=igParse(tp.link||'');
        var code=ig?ig.code:null;
        if(code&&have[code])return;
        var when=tp.date?Date.parse(tp.date):now();
        bucket.posts.push({
          id:uid(),url:ig?ig.url:(tp.link||null),code:code,
          postedAt:code?igDate(code):null,
          type:(tp.type==='carousel'?'carousel':tp.type==='image'?'image':tp.type==='reel'?'reel':null)||(ig?detectType(ig.url):'image'),
          note:'',takenAt:isNaN(when)?now():when,
          done:!!tp.produced, doneAt:tp.produced?(isNaN(when)?now():when):undefined,
          queued:!!tp.queued&&!tp.produced
        });
        if(code)have[code]=1;
        added++;
      });
    });
    return added;
  }
  function tryAutoImport(){
    try{
      var raw=localStorage.getItem('ig_tracker_v7');
      if(!raw)return 0;
      if(localStorage.getItem('sources-imported-v7'))return 0;
      var n=importTracker(raw);
      if(n){localStorage.setItem('sources-imported-v7','1');saveNow();}
      return n;
    }catch(e){return 0;}
  }

      R.querySelectorAll('[data-note]').forEach(function(inp){inp.oninput=function(){var p=c.posts.filter(function(x){return x.id===inp.dataset.note;})[0];if(p){p.note=inp.value;save();}};});
      R.querySelectorAll('[data-delpost]').forEach(function(b){b.onclick=function(){snap();c.posts=c.posts.filter(function(p){return p.id!==b.dataset.delpost;});save();render();toast('Post retiré');};});
      var dd=document.getElementById('d-del');if(dd)dd.onclick=function(){snap();var hd=c.handle;S.comps=S.comps.filter(function(x){return x.id!==c.id;});ui.sel=null;save();render();toast('@'+hd+' supprimé');};
    }
  }
  function closeDrawer(){ui.sel=null;render();}
  function openAccountModal(){modal='account';render();var el=document.getElementById('m-name');if(el)el.focus();}
  function openCompModal(){modal='comp';render();var el=document.getElementById('m-handle');if(el)el.focus();}

  function submitModal(){
    if(modal==='account'){
      var el=document.getElementById('m-name');var name=(el.value||'').trim();if(!name){el.focus();return;}
      var id=uid();S.my.push({id:id,name:name,handle:'',color:PAL[S.my.length%PAL.length],cadence:{reel:0,carousel:0,image:0}});modal=null;ui.view=id;save();buzz(10);render();return;
    }
    var eh=document.getElementById('m-handle');var raw=(eh.value||'').trim();var ig=igParse(raw);
    var handle=ig&&ig.user?ig.user:raw.replace(/^@+/,'').replace(/\s+/g,'');
    if(!handle){eh.focus();return;}
    var owner=ui.view!=='dash'?ui.view:(S.my[0]&&S.my[0].id);
    var dup=null;
    S.comps.forEach(function(x){if(x.handle.toLowerCase()===handle.toLowerCase())dup=x;});
    if(dup){
      modal=null;
      if(ui.moveAfter&&ui.moveAfter.length&&ui.sel){
        var src2=comp(ui.sel);var ids2=ui.moveAfter;ui.moveAfter=null;
        if(src2){movePicked(src2,dup.id,ids2);}
      }
      ui.sel=dup.id;render();
      var ownerName=(myAcc(dup.owner)||{}).name||'';
      toast('@'+dup.handle+' existe déjà'+(ownerName?' (pour '+ownerName+')':''));
      return;
    }
    var id=uid();var c={id:id,owner:owner,handle:handle,name:'',lang:modalLang,note:'',createdAt:now(),posts:[]};
    if(ig){c.posts.push({id:uid(),url:ig.url,code:ig.code,postedAt:igDate(ig.code),note:'',takenAt:now()});}
    S.comps.push(c);modal=null;
    if(ui.moveAfter&&ui.moveAfter.length&&ui.sel){
      var src=comp(ui.sel);var ids=ui.moveAfter;ui.moveAfter=null;
      if(src){movePicked(src,id,ids);ui.sel=id;render();return;}
    }
    ui.moveAfter=null;ui.sel=id;save();buzz(12);render();
  }

  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(ui.rowModal){ui.rowModal=null;render();}else if(ui.sel)closeDrawer();else if(modal){modal=null;render();}}});

  /* ---------- migrate real data only ---------- */
  function migrate(v2raw,v1raw){
    // v2 : garder les comptes ajoutés par l'utilisateur (id hors set d'exemple) + leurs concurrents
    if(v2raw){try{var d=JSON.parse(v2raw);if(d.my&&d.comps){
      var keepMy=d.my.filter(function(a){return !SEED_IDS[a.id];});
      if(keepMy.length){var ids={};keepMy.forEach(function(a){ids[a.id]=1;});
        S.my=keepMy;S.comps=d.comps.filter(function(c){return ids[c.owner];});return true;}
    }}catch(e){}}
    // v1 : concurrents non-demo -> compte "À trier"
    if(v1raw){try{var o=JSON.parse(v1raw);var imp=(o.accounts||[]).filter(function(a){return !a.demo;});
      if(imp.length){var inbox=uid();S.my=[{id:inbox,name:'À trier',handle:'',color:PAL[0]}];
        imp.forEach(function(a){S.comps.push({id:uid(),owner:inbox,handle:a.handle,name:(a.name&&a.name!=='exemple')?a.name:'',lang:a.lang||'other',note:'',createdAt:a.createdAt||now(),
          posts:(a.posts||[]).map(function(p){return {id:uid(),url:p.url||null,code:p.code||null,postedAt:p.postedAt||null,note:p.label||'',takenAt:p.takenAt||now()};})});});
        return true;}
    }catch(e){}}
    return false;
  }

  (async function init(){
    var raw=await store.get(KEY);
    if(raw){try{var d=JSON.parse(raw);if(d.my)S.my=d.my;if(d.comps)S.comps=d.comps;
      var chg=false;S.comps.forEach(function(c){c.posts.forEach(function(p){if(p.type==='post'){p.type='image';chg=true;}});});
      if(chg)save();
    }catch(e){}
      var n0=tryAutoImport();
      render();
      if(n0)toast(n0+' posts importés depuis Content Tracker');
      cloudInit();
      return;}
    var v2=await store.get(V2), v1=await store.get(V1);
    migrate(v2,v1);
    var n=tryAutoImport();
    if(S.my.length)saveNow();
    if(S.my.length&&ui.view==='dash')ui.view=S.my[0].id;
    render();
    if(n)toast(n+' posts importés depuis Content Tracker');
    cloudInit();
  })();
})();
</script>
